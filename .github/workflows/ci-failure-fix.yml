name: Auto-Fix CI Failures

on:
  workflow_run:
    workflows: ["Testing Laravel"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  fix-failure:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.actor.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: google-labs-code/jules-action@v1.0.0
        with:
          include_last_commit: true
          include_commit_log: true
          starting_branch: ${{ github.event.workflow_run.head_branch }}
          prompt: |
            The CI workflow "${{ github.event.workflow_run.name }}" has failed on this Laravel 13 project.

            **Failed Run:** ${{ github.event.workflow_run.html_url }}
            **Branch:** ${{ github.event.workflow_run.head_branch }}
            **Commit:** ${{ github.event.workflow_run.head_sha }}

            ## Project Context

            - **Framework:** Laravel 13, PHP 8.4, strict_types everywhere
            - **Architecture:** Modular DDD - active modules are IAM and Media under `modules/`
            - **Layer anatomy per module:** Actions, Builders, Http(Controllers|Middleware|Requests|Resources), Models, Payloads, Policies, Providers, Services, Support
            - **Permissions:** Spatie Permission with Sanctum guard, `PermissionEnum` / `RoleEnum`
            - **Code style:** PHP 8 attributes (`#[Fillable]`, `#[Hidden]`, `#[UseFactory]`) over `$fillable` / `$hidden`
            - **Tests:** Pest 5; strict split Unit (no database) vs Feature (database via RefreshDatabase), enforced by architecture tests
            - **Test helpers:** `assertSuccessResponse()`, `assertProblemResponse()`, `assertPaginatedResponse()` in tests/Helpers.php
            - **Quality gate:** `composer ci:check` runs pint, rector:dry, phpstan, pest, profanity in sequence
            - **Conventions:** read `.ai/rules/*.md`, `docs/architecture.md`, ADRs in `docs/adr/`; all commits and PR text must be English
            - **Known accepted divergences:** docs/architecture.md section 11 lists five PHPantom findings that are intentionally left as-is; do not chase them

            ## Tools Available

            - Use `laravel-boost:search-docs` before changing Laravel ecosystem APIs - it returns version-specific docs based on installed packages
            - Use `context7:query-docs` for third-party package documentation (e.g., Pest, Spatie, Laravel modules)
            - Use `gh_grep:searchGitHub` to check real usage patterns in the codebase before changing them

            ## Debugging Process

            1. PRE-CHECK - Run `gh pr list --state open` and `git log --oneline -20` to check for duplicate work; if an open PR or recent commit already fixes this failure, skip and comment instead
            2. Inspect - Review the failed run logs to identify errors
            3. Analyze - Determine if the failure is in code, config, or dependencies
            4. Fix - Implement minimal, targeted fix following Laravel 13 conventions
            5. Verify - Run the quality gate: `composer ci:check`
               If ANY step fails, diagnose, fix, re-run until all pass
            6. PR - Open a PR only if all checks pass

            ## Rules

            - Follow existing code conventions (sibling files set the pattern)
            - `declare(strict_types=1)` on every PHP file
            - `final readonly` for Action / Controller / Payload classes
            - Keep changes under 30 lines (surgical fixes)
            - Verification loop: after applying fix, run `composer ci:check`. If any step fails, diagnose, fix, re-run until all pass before creating PR.

          jules_api_key: ${{ secrets.JULES_API_KEY }}
