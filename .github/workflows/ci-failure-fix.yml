name: Auto-Fix CI Failures

on:
  workflow_run:
    workflows: ["Testing Laravel"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  DB_CONNECTION: sqlite
  DB_DATABASE: ':memory:'

jobs:
  fix-failure:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.actor.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, sqlite
          tools: composer:latest
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare the Application
        run: |
          php -r "file_exists('.env.testing') || copy('.env.example', '.env.testing');"
          php artisan key:generate --env=testing
          php artisan config:clear --env=testing

      - name: Invoke Jules to fix failure
        uses: google-labs-code/jules-action@v1.0.0
        with:
          include_last_commit: true
          include_commit_log: true
          starting_branch: ${{ github.event.workflow_run.head_branch }}
          prompt: |
            The CI workflow "${{ github.event.workflow_run.name }}" has failed on this Laravel 13 project.

            **Failed Run:** ${{ github.event.workflow_run.html_url }}
            **Branch:** ${{ github.event.workflow_run.head_branch }}
            **Commit:** ${{ github.event.workflow_run.head_sha }}

            ## Project Context

            - **Framework:** Laravel 13, PHP 8.4
            - **Architecture:** Modular DDD (Actions, Controllers, Filters, Payloads, Resources per module)
            - **Auth:** Sanctum Bearer tokens (API-only)
            - **Permissions:** Spatie Permission with Sanctum guard, `PermissionEnum`/`RoleEnum` enums
            - **Tests:** Pest 4 with `php artisan test --compact --parallel`
            - **Code style:** PHP 8 attributes (`#[Fillable]`, `#[Hidden]`) over `$fillable`/`$hidden`
            - **Quality gate:** Pint (formatting), PHPStan (static analysis), Pest (type coverage + tests)

            ## Debugging Process

            1. **Inspect** — Review the failed run logs to identify errors
            2. **Analyze** — Determine if the failure is in code, config, or dependencies
            3. **Fix** — Implement minimal, targeted fix following Laravel 13 conventions
            4. **Verify** — Run the quality gate: `vendor/bin/pint --test && vendor/bin/phpstan analyse && php artisan test --compact`
            5. **PR** — Open a PR only if all checks pass

            ## Rules

            - Follow existing code conventions (sibling files set the pattern)
            - `declare(strict_types=1)` on every PHP file
            - `final readonly` for Action / Controller / Payload classes
            - Keep changes under 30 lines (surgical fixes)
            - All existing tests must pass
          jules_api_key: ${{ secrets.JULES_API_KEY }}

      - name: Verify fix passes quality gate
        run: |
          php artisan config:clear --env=testing
          vendor/bin/pint --test
          vendor/bin/phpstan analyse --error-format=github
          vendor/bin/pest --no-interaction --compact
