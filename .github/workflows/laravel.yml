name: Testing Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel (PHP ${{ matrix.php-versions }})
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.4', '8.5']

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mbstring, dom, fileinfo, pdo_sqlite, xml, curl, zip, pcntl
        coverage: xdebug
        ini-values: |
          memory_limit=-1
          xdebug.mode=coverage
          xdebug.start_with_request=yes

    - name: Get Composer Cache Directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer Dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Validate composer.json
      run: composer validate --strict

    - name: Install Composer Dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Check for Known Vulnerabilities
      run: composer audit

    - name: Prepare the Application
      run: |
        php -r "file_exists('.env.testing') || copy('.env.example', '.env.testing');"
        php artisan key:generate --env=testing

    - name: Create Database
      run: touch database/database.sqlite

    - name: Check Code Formatting (Pint)
      run: vendor/bin/pint --test

    - name: Static Analysis (Larastan)
      run: vendor/bin/phpstan analyse --error-format=github

    - name: Execute Tests & Type Coverage (Pest/PHPUnit)
      run: php artisan test --parallel --compact --coverage
