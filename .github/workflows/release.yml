name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    name: Quality Gate (PHP 8.4)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      APP_ENV: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, xml, curl, zip, pcntl
          coverage: xdebug
          ini-values: |
            memory_limit=-1
            xdebug.mode=coverage
            xdebug.start_with_request=yes

      - name: Get Composer Cache Directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare the Application
        run: |
          php -r "file_exists('.env.testing') || copy('.env.example', '.env.testing');"
          php artisan key:generate --env=testing

      - name: Check Code Formatting (Pint)
        run: vendor/bin/pint --test

      - name: Static Analysis (Larastan)
        run: vendor/bin/phpstan analyse --error-format=github

      - name: Execute Tests (Pest)
        run: php artisan test --compact --coverage

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Shipmark Release
        id: shipmark
        run: npx @grazulex/shipmark release --ci "$BUMP" 2>&1 | tee /tmp/shipmark.log
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ github.triggering_actor }}
          GIT_AUTHOR_EMAIL: ${{ github.triggering_actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.triggering_actor }}
          GIT_COMMITTER_EMAIL: ${{ github.triggering_actor }}@users.noreply.github.com

      - name: Resolve Tag
        id: tag
        run: |
          TAG="$(grep -oP 'SHIPMARK_TAG=\K[^ ]+' /tmp/shipmark.log || true)"
          if [ -z "$TAG" ]; then
            TAG="$(git describe --tags --abbrev=0)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" \
              --title "Release $TAG" \
              --generate-notes \
              --latest
          fi
