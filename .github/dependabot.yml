version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
    cooldown:
      default-days: 5
    groups:
      composer:
        patterns:
          - "*"
    ignore:
      # 2.3.2 crashes the analyser on anonymous Model classes in module tests; revisit with the next release.
      - dependency-name: "phpstan/phpstan"
        versions:
          - "2.3.2"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
